# CI gates for eshu-collector-grafana (org gate contract).
#
# Frozen job names: changes, lint, test, race, shell, govulncheck, gosec,
# ci-complete. ci-complete is the ONLY context the main ruleset requires:
# it fails if a needed lane failed and passes when lanes were legitimately
# skipped (docs-only PRs). A later move of lane bodies to eshu-hq/.github
# reusable workflows keeps these names, so branch protection never churns.
#
# Path selection happens once, in `changes` (dorny/paths-filter). A PR only
# pays for lanes its paths can affect:
#   docs only (*.md, LICENSE) .... no lanes, ci-complete succeeds
#   Go sources (**/*.go) .......... lint, test, race (+ coverage artifact)
#   go.mod/go.sum/.golangci.yml .... lint, test, race, govulncheck
#   .github/workflows/** .......... actionlint, plus lint, test, race
#   shell (**/*.sh, none today) .... shell only
# Push to main runs every lane. The weekly schedule runs govulncheck and
# gosec; govulncheck findings open or update an issue.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_VERSION: 2.12.2
  GOVULNCHECK_VERSION: 1.9.0
  GOSEC_VERSION: 2.30.0
  ACTIONLINT_VERSION: 1.7.12
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  COVERAGE_FLOOR: "91.5"

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      go: ${{ steps.filter.outputs.go }}
      deps: ${{ steps.filter.outputs.deps }}
      workflow: ${{ steps.filter.outputs.workflow }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'LICENSE*'
            go:
              - '**/*.go'
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            workflow:
              - '.github/workflows/**'
            shell:
              - '**/*.sh'

  lint:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.GOLANGCI_VERSION }} run ./...
      - name: Format check (gofumpt)
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.GOLANGCI_VERSION }} fmt --diff ./...
      - name: Module tidiness
        run: go mod tidy -diff
      - name: 500-line file cap
        run: |
          over=$(git ls-files '*.go' | while IFS= read -r f; do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ]; then printf '%s (%s lines)\n' "$f" "$n"; fi
          done)
          if [ -n "$over" ]; then
            echo "Files over the 500-line cap:"
            echo "$over"
            exit 1
          fi
          echo "500-line cap: OK ($(git ls-files '*.go' | wc -l) files checked)"
      - name: Install actionlint
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true'
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/rhysd/actionlint/cmd/actionlint@v${{ env.ACTIONLINT_VERSION }}
      - name: actionlint
        if: github.event_name != 'pull_request' || needs.changes.outputs.workflow == 'true'
        run: actionlint

  test:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./... -count=1

  race:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Race tests with coverage
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage.out
          retention-days: 14
      - name: Coverage summary and floor
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')
          {
            echo "## Coverage"
            echo ""
            echo "Total: **${total}%** (floor ${COVERAGE_FLOOR}%)"
            echo ""
            echo "| Package | Statements |"
            echo "| --- | --- |"
            grep -v '^mode:' coverage.out | awk '{ f=$1; sub(/:[0-9]+\.[0-9]+,[0-9]+\.[0-9]+$/, "", f); pkg=f; sub(/\/[^/]+$/, "", pkg); s[pkg]+=$2; if ($3 > 0) c[pkg]+=$2 } END { for (p in s) printf "| \`%s\` | %.1f%% (%d/%d) |\n", p, 100*c[p]/s[p], c[p], s[p] }' | sort
          } >> "$GITHUB_STEP_SUMMARY"
          echo "total coverage: ${total}% (floor ${COVERAGE_FLOOR}%)"
          awk -v total="$total" -v floor="$COVERAGE_FLOOR" 'BEGIN { if (total + 0 < floor + 0) { printf "coverage %.1f%% is below floor %s%%\n", total, floor; exit 1 } }'

  shell:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.shell == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: shellcheck
        shell: bash
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          shopt -s globstar nullglob
          files=(**/*.sh)
          if ((${#files[@]} == 0)); then
            echo "No shell scripts in tree; lane passes vacuous."
            exit 0
          fi
          shellcheck_bin="/tmp/shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$shellcheck_bin" "${files[@]}"

  govulncheck:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # issues:write is used ONLY by the schedule-only filing step below.
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Scan
        id: scan
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/vuln/cmd/govulncheck@v${{ env.GOVULNCHECK_VERSION }}
          govulncheck ./... | tee govulncheck.txt
      - name: File or update tracking issue (schedule only)
        if: ${{ always() && github.event_name == 'schedule' && steps.scan.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="govulncheck findings ($(date -u +%F))"
          findings=$(cat govulncheck.txt)
          body="Weekly govulncheck run $GITHUB_RUN_ID reported findings. See the run log for the full report."
          body="$body Findings: $findings"
          number=$(gh issue list --search "$title in:title" --state open --json number --query '.[0].number')
          if [ -n "$number" ] && [ "$number" != "null" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.workflow == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # security-events:write is used ONLY by the SARIF upload step, which
      # runs on push/schedule (fork PRs run the scan with a read-only token).
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Scan (advisory)
        id: scan
        continue-on-error: true
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/securego/gosec/v2/cmd/gosec@v${{ env.GOSEC_VERSION }}
          gosec -fmt sarif -out gosec.sarif ./...
      - name: Report findings
        if: always()
        run: |
          count=$(python3 -c "import json; print(sum(len(r.get('results', [])) for r in json.load(open('gosec.sarif'))['runs']))")
          echo "gosec findings: $count (advisory — triaged in the Security tab, never blanket-excluded)" >> "$GITHUB_STEP_SUMMARY"
          echo "gosec findings: $count (advisory)"
      - name: Upload SARIF
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && hashFiles('gosec.sarif') != ''
        uses: github/codeql-action/upload-sarif@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          sarif_file: gosec.sarif

  ci-complete:
    if: always()
    needs: [changes, lint, test, race, shell, govulncheck, gosec]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Gate
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -qE '"result": "(failure|cancelled)"'; then
            echo "ci-complete: a needed lane failed or was cancelled"
            exit 1
          fi
          echo "ci-complete: all needed lanes passed (skips are legitimate)"
